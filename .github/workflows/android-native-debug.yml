name: Build Android Native V2 Debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-native-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradle wrapper executable
        working-directory: android-native
        run: chmod +x ./gradlew

      - name: Build native debug APK
        working-directory: android-native
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain

      - name: Generate APK version
        id: apk-version
        shell: bash
        run: |
          base_version=$(node -p "require('./package.json').version.split('-')[0]")
          short_sha="${GITHUB_SHA::7}"
          version="${base_version}+native.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.${short_sha}"
          apk_name="splayer-native-v2-debug-${version}.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"
          cp android-native/app/build/outputs/apk/debug/app-debug.apk "${apk_name}"

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: splayer-native-v2-debug-${{ steps.apk-version.outputs.version }}
          path: ${{ steps.apk-version.outputs.apk_name }}

      - name: Publish native APK release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk-version.outputs.apk_name }}
          APK_VERSION: ${{ steps.apk-version.outputs.version }}
        shell: bash
        run: |
          tag_name="android-native-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          release_title="Android Native Debug APK ${APK_VERSION}"
          git tag "$tag_name" "$GITHUB_SHA"
          git push origin "$tag_name"
          cat > release_notes.md <<EOF
          Android Native debug APK

          - Version: ${APK_VERSION}
          - Commit: ${GITHUB_SHA}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$tag_name" \
            --title "$release_title" \
            --notes-file release_notes.md \
            --prerelease \
            --target "$GITHUB_SHA"
          gh release upload "$tag_name" "$APK_NAME"
